<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="normalize.css">
  <link rel="stylesheet" href="index.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

</head>

<body>

  <main>
    <div class="productContainer">

      <picture>

        <source media="(min-width: 550px)" srcset="images/image-product-desktop.jpg">

        <img class="productPicture" src="images/image-product-mobile.jpg" alt="Product picture Gabrielle Essence Eau De Parfum">

      </picture>
    
      <div class="textContainer">
        <p class="productName">PERFUME</p>

        <h1>Gabrielle Essence Eau De Parfum</h1>

        <p class="text">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.</p>

        <p class="price"><span class="newPrice">$149.99</span><span class="oldPrice"><sup><del>$169.99</del></sup></span></p>

        <button class="addToCart"><img class="shoppingCart" src="./images/icon-cart.svg" alt="Icon shopping cart">Add to Cart</button>
      
      </div>
    </div>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>

</body>
</html>
